<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KUET & Khulna Interactive Bing Road Map</title>
  
  <!-- CRITICAL FIX: Force Leaflet to disable hardware-accelerated 3D CSS transforms
       in JavaFX WebKit on Windows. This prevents tile scattering, misalignments, and black gaps. -->
  <script>
    window.L_DISABLE_3D = true;
  </script>

  <!-- Offline-ready local Leaflet bundle -->
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Seamless match with Microsoft Bing Road map ground color */
      background: #F0EEEA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: #F0EEEA;
    }

    /* Map HUD Floating Glass Cockpit */
    .map-hud {
      display: none !important;
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px 16px;
      color: #F8FAFC;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
      max-width: 360px;
      transition: all 0.3s ease;
    }
    body.light-theme .map-hud {
      display: none !important;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(15, 23, 42, 0.1);
      color: #0F172A;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .hud-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      text-transform: uppercase;
      color: #38BDF8;
    }
    body.light-theme .hud-title {
      color: #0284C7;
    }
    .hud-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
    }
    .hud-coords {
      font-size: 11px;
      font-family: monospace;
      color: #94A3B8;
      margin-bottom: 6px;
    }
    body.light-theme .hud-coords {
      color: #64748B;
    }
    .hud-info {
      font-size: 11.5px;
      opacity: 0.92;
      line-height: 1.45;
    }

    /* Popups */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.96);
      color: #F8FAFC;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    body.light-theme .leaflet-popup-content-wrapper {
      background: #FFFFFF;
      color: #0F172A;
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.96);
    }
    body.light-theme .leaflet-popup-tip {
      background: #FFFFFF;
    }
    .popup-card {
      padding: 6px 8px;
    }
    .popup-title {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 4px;
      color: #0EA5E9;
    }
    body.light-theme .popup-title {
      color: #0284C7;
    }
    .popup-sub {
      font-size: 11px;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .popup-action {
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .popup-action:hover {
      background: #0369A1;
    }

    /* Custom Markers */
    .custom-hub-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0A3D36, #0E7A5F);
      color: white;
      box-shadow: 0 4px 14px rgba(10, 61, 54, 0.45);
      border: 2px solid white;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .custom-hub-pin:hover {
      transform: scale(1.15);
    }
    .hub-count-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #10B981;
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      border: 1.5px solid white;
      line-height: 1.2;
    }
    .custom-user-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #10B981;
      color: white;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.9);
      border: 2px solid white;
      animation: pulse 2s infinite;
      cursor: move;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
      70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Leaflet zoom controls styling for premium UI */
    .leaflet-bar {
      border: 1px solid rgba(0, 0, 0, 0.15) !important;
      border-radius: 8px !important;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2) !important;
    }
    .leaflet-bar a {
      background-color: rgba(255, 255, 255, 0.96) !important;
      color: #0F172A !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
      width: 32px !important;
      height: 32px !important;
      line-height: 32px !important;
      font-size: 16px !important;
      font-weight: 700 !important;
    }
    .leaflet-bar a:hover {
      background-color: #0284C7 !important;
      color: #FFFFFF !important;
    }

    /* ── Locate Me button (bottom-right, Google Maps style) ── */
    #locateBtn {
      display: none !important;
      position: absolute;
      bottom: 24px;
      right: 20px;
      z-index: 1000;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.97);
      border: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.22);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, box-shadow 0.15s;
      outline: none;
    }
    #locateBtn:hover {
      background: #f0faf7;
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
    }
    #locateBtn:active { transform: scale(0.93); }
    #locateBtn svg { display: block; }
  </style>
</head>
<body class="dark-theme">
  <div id="map"></div>

  <!-- Real-time HUD -->
  <div class="map-hud">
    <div class="hud-title">
      <span class="hud-badge"></span>
      <span>KUET Campus Map</span>
    </div>
    <div class="hud-coords" id="hudCoords">22.9009° N, 89.5016° E</div>
    <div class="hud-info" id="hudInfo">
      Click anywhere on campus to set your location pin. Nearest station and walking distance will be calculated.
    </div>
  </div>

  <!-- Locate Me button — bottom-right corner like Google Maps -->
  <button id="locateBtn" title="Find my location" onclick="locateMe()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A3D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="2"  x2="12" y2="6"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2"  y1="12" x2="6"  y2="12"/>
      <line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
  </button>

  <script>
    // KUET & Khulna Anchor Coordinates
    const KUET_CENTER = [22.9009, 89.5016];
    const KHULNA_CENTER = [22.8450, 89.5400];

    // Official KUET Campus Stations
    const CAMPUS_HUBS = [
      { id: "hub-1", name: "KUET Central Mosque", lat: 22.9009, lng: 89.5016, cycles: 4 },
      { id: "hub-2", name: "Student Welfare Centre", lat: 22.9017, lng: 89.5030, cycles: 3 },
      { id: "hub-3", name: "KUET Main Gate", lat: 22.8987, lng: 89.4981, cycles: 2 },
      { id: "hub-4", name: "Hall Gate", lat: 22.9045, lng: 89.5060, cycles: 5 },
      { id: "hub-5", name: "Academic Building", lat: 22.9015, lng: 89.5010, cycles: 3 }
    ];

    // Khulna City Roaming Checkpoints & Partner Zones
    const KHULNA_ZONES = [
      { id: "zone-1", name: "Fulbarigate Transit Hub", lat: 22.8950, lng: 89.5040, desc: "Direct KUET link & market connection" },
      { id: "zone-2", name: "Daulatpur Terminal", lat: 22.8700, lng: 89.5200, desc: "Midway Khulna transit corridor" },
      { id: "zone-3", name: "Khalishpur Commercial", lat: 22.8550, lng: 89.5300, desc: "Residential & shopping corridor" },
      { id: "zone-4", name: "Boyra Civic Center", lat: 22.8400, lng: 89.5350, desc: "Civic center & hospital intersection" },
      { id: "zone-5", name: "Sonadanga Bus Terminal", lat: 22.8180, lng: 89.5530, desc: "Inter-district bus access terminal" },
      { id: "zone-6", name: "Shibbari Circle (City Core)", lat: 22.8150, lng: 89.5580, desc: "Downtown commercial center" },
      { id: "zone-7", name: "Royal Mor / Rupsha Riverfront", lat: 22.8100, lng: 89.5640, desc: "Khulna riverfront & cultural district" }
    ];

    // Khulna Metropolitan Commute Geofence Polygon Coordinates
    const KHULNA_GEOFENCE = [
      [22.9100, 89.4950],
      [22.9100, 89.5150],
      [22.8900, 89.5300],
      [22.8600, 89.5500],
      [22.8100, 89.5800],
      [22.7950, 89.5600],
      [22.8100, 89.5300],
      [22.8500, 89.5100],
      [22.8850, 89.4900],
      [22.9100, 89.4950]
    ];

    let map;
    let bingRoadLayer;
    let hubMarkers = [];
    let liveCycleMarkers = [];
    let userMarker = null;
    let routeLine = null;
    let currentTheme = 'dark';

    // Microsoft Virtual Earth QuadKey Generator
    function getBingQuadKey(x, y, z) {
      let quadKey = '';
      for (let i = z; i > 0; i--) {
        let digit = 0;
        const mask = 1 << (i - 1);
        if ((x & mask) !== 0) digit++;
        if ((y & mask) !== 0) digit += 2;
        quadKey += digit;
      }
      return quadKey;
    }

    function initMap() {
      if (map) return;

      // 1. Initialize Leaflet Map centered directly on KUET campus
      map = L.map('map', {
        center: KUET_CENTER,
        zoom: 16,
        minZoom: 11,
        maxZoom: 19,
        zoomControl: false,
        attributionControl: false,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        touchZoom: true,
        boxZoom: true,
        dragging: true,
        preferCanvas: true
      });

      // Expose map globally for JavaFX controller zoom calls
      window.map = map;

      // 2. Esri World Street Map — free, no API key, works from any user-agent including JavaFX WebView
      //    Based on OpenStreetMap data. Esri tile API uses {z}/{y}/{x} ordering.
      const osmLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), MapmyIndia &mdash; &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        updateWhenZooming: false,
        updateWhenIdle: true,
        keepBuffer: 3
      });
      osmLayer.addTo(map);

      // Standard top-right Zoom control (+ / -) like normal maps
      L.control.zoom({ position: 'topright' }).addTo(map);

      // Draw Khulna Metropolitan Roaming Geofence
      L.polygon(KHULNA_GEOFENCE, {
        color: '#0EA5E9',
        weight: 2,
        dashArray: '6, 8',
        fillColor: '#0284C7',
        fillOpacity: 0.08
      }).addTo(map);

      // Render KUET Campus Station Hubs
      renderHubs();

      // Render Khulna City Roaming Checkpoints
      renderCityZones();

      // Set initial User Pin at Central Mosque
      setUserPin(22.9009, 89.5016, false);

      // Handle map clicks
      map.on('click', function(e) {
        setUserPin(e.latlng.lat, e.latlng.lng, true);
      });

      // Force layout invalidation after DOM attachment
      setTimeout(function() {
        if (map) map.invalidateSize();
      }, 150);

      window.addEventListener('resize', function() {
        if (map) map.invalidateSize();
      });
    }

    function renderHubs() {
      CAMPUS_HUBS.forEach(hub => {
        const icon = L.divIcon({
          className: 'custom-hub-container',
          html: `<div class="custom-hub-pin">
                   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                     <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
                     <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5L9 6H4m8 11.5l3.5-7 3.5 7M12 17.5V11h3"/>
                   </svg>
                   <span class="hub-count-badge">${hub.cycles}</span>
                 </div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = L.marker([hub.lat, hub.lng], { icon: icon }).addTo(map);
        hubMarkers.push(marker);
      });
    }

    function renderCityZones() {
      KHULNA_ZONES.forEach(zone => {
        const icon = L.divIcon({
          className: 'custom-zone-container',
          html: `<div style="background:#0EA5E9; color:white; width:26px; height:26px; border-radius:50%; border:2px solid white; display:flex; align-items:center; justify-content:center; box-shadow:0 0 12px rgba(14,165,233,0.7); cursor:pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M13 21V3l6 3v15"/></svg></div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });

        const marker = L.marker([zone.lat, zone.lng], { icon: icon }).addTo(map);
      });
    }

    // ── Locate Me (bottom-right GPS button) ──────────────────────────────────
    function locateMe(targetLat, targetLng) {
      if (!map) return;
      const btn = document.getElementById('locateBtn');
      if (btn) {
        btn.style.transform = 'scale(0.85)';
        setTimeout(() => { if (btn) btn.style.transform = 'scale(1)'; }, 180);
      }

      function performLocate(lat, lng) {
        setUserPin(lat, lng, true);
        map.flyTo([lat, lng], 18, { animate: true, duration: 1.0 });
      }

      if (typeof targetLat === 'number' && typeof targetLng === 'number') {
        performLocate(targetLat, targetLng);
        return;
      }

      if (userMarker) {
        const p = userMarker.getLatLng();
        map.flyTo([p.lat, p.lng], 18, { animate: true, duration: 1.0 });
        return;
      }

      performLocate(KUET_CENTER[0], KUET_CENTER[1]);
    }

    function setUserPin(lat, lng, notifyBridge) {
      if (!map) return;

      if (userMarker) {
        userMarker.setLatLng([lat, lng]);
      } else {
        const userIcon = L.divIcon({
          className: 'custom-user-container',
          html: `<div class="custom-user-pin"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        userMarker = L.marker([lat, lng], { icon: userIcon, draggable: true }).addTo(map);
        userMarker.on('dragend', function(e) {
          const pos = e.target.getLatLng();
          setUserPin(pos.lat, pos.lng, true);
        });
      }

      // Calculate nearest campus hub and distance
      let nearestHub = CAMPUS_HUBS[0];
      let minDistance = 999999;

      CAMPUS_HUBS.forEach(hub => {
        const d = calculateDistance(lat, lng, hub.lat, hub.lng);
        if (d < minDistance) {
          minDistance = d;
          nearestHub = hub;
        }
      });

      const distMeters = Math.round(minDistance);
      const walkMinutes = Math.max(1, Math.round(distMeters / 75));

      // Update HUD
      const coordsElem = document.getElementById('hudCoords');
      if (coordsElem) coordsElem.innerText = `${lat.toFixed(4)}° N, ${lng.toFixed(4)}° E`;
      
      const infoElem = document.getElementById('hudInfo');
      if (infoElem) {
        infoElem.innerHTML = `
          <strong>Nearest Station:</strong> ${nearestHub.name}<br>
          <strong>Distance:</strong> ${distMeters}m (~${walkMinutes} min walk)<br>
          <span style="color:#10B981; font-weight:700;">✓ ${nearestHub.cycles} bicycles available</span>
        `;
      }

      // Draw dashed guidance line to nearest hub
      if (routeLine) {
        map.removeLayer(routeLine);
      }
      routeLine = L.polyline([[lat, lng], [nearestHub.lat, nearestHub.lng]], {
        color: '#0EA5E9',
        weight: 3,
        dashArray: '6, 8',
        opacity: 0.90
      }).addTo(map);

      // Notify JavaFX Bridge
      if (notifyBridge && window.campusBridge) {
        try {
          window.campusBridge.onLocationSelected(lat, lng, nearestHub.name, distMeters);
        } catch (e) {
          console.log("Bridge notification:", e);
        }
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const phi1 = lat1 * rad;
      const phi2 = lat2 * rad;
      const deltaPhi = (lat2 - lat1) * rad;
      const deltaLambda = (lon2 - lon1) * rad;

      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function onHubClicked(hubName) {
      if (window.campusBridge) {
        try {
          window.campusBridge.onHubSelected(hubName);
        } catch (e) {
          console.log("Bridge hub click:", e);
        }
      }
    }

    // JavaFX Public API Interface
    window.CampusMap = {
      setCycles: function(payload) {
        try {
          const cycles = (typeof payload === 'string') ? JSON.parse(payload) : (payload || []);
          const counts = {};
          (cycles || []).forEach(c => {
            const hub = c.hub || c.pickup_point || c.pickupPoint;
            if (hub) counts[hub] = (counts[hub] || 0) + 1;
          });
          CAMPUS_HUBS.forEach(h => {
            if (counts[h.name] !== undefined) h.cycles = counts[h.name];
          });
          liveCycleMarkers.forEach(m => { if (map) map.removeLayer(m); });
          liveCycleMarkers = [];
          if (!map) return;
          hubMarkers.forEach(m => { if (map) map.removeLayer(m); });
          hubMarkers = [];
          renderHubs();
          (cycles || []).forEach(c => {
            const lat = Number(c.lat !== undefined ? c.lat : c.latitude);
            const lng = Number(c.lng !== undefined ? c.lng : c.longitude);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
            const icon = L.divIcon({
              className: 'custom-cycle-container',
              html: '<div style="background:#0284C7;color:white;width:24px;height:24px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(2,132,199,0.7);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5L9 6H4m8 11.5l3.5-7 3.5 7M12 17.5V11h3"/></svg></div>',
              iconSize: [24, 24], iconAnchor: [12, 12]
            });
            const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
            const label = String(c.label || 'Campus Cycle');
            const hub = String(c.hub || c.pickup_point || c.pickupPoint || '');
            marker.bindPopup('<div class="popup-card"><div class="popup-title">' + label.replace(/</g, '&lt;') + '</div><div class="popup-sub">' + hub.replace(/</g, '&lt;') + '</div></div>');
            liveCycleMarkers.push(marker);
          });
        } catch (e) { console.log('setCycles:', e); }
      },
      setTheme: function(themeMode) {
        currentTheme = (themeMode === 'DARK') ? 'dark' : 'light';
        document.body.className = currentTheme + '-theme';
      },
      setUserLocation: function(lat, lng) {
        setUserPin(lat, lng, false);
      },
      focusLocation: function(lat, lng) {
        if (map) {
          map.flyTo([lat, lng], 16, { duration: 1.0 });
          setUserPin(lat, lng, false);
        }
      },
      centerKuet: function() {
        if (map) {
          map.flyTo(KUET_CENTER, 16, { duration: 1.0 });
        }
      },
      invalidateSize: function() {
        if (map) {
          map.invalidateSize();
        }
      },
      zoomIn: function() {
        if (map) map.zoomIn();
      },
      zoomOut: function() {
        if (map) map.zoomOut();
      },
      locateMe: function(targetLat, targetLng) {
        locateMe(targetLat, targetLng);
      }
    };

    // Auto-initialize when window loads
    window.onload = function() {
      try {
        initMap();
      } catch (err) {
        console.error("Map initialization error: ", err);
      }
    };
