<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; font-family: Segoe UI, Arial, sans-serif; }
    .gm-style .map-card { font-weight: 600; color: #172130; padding: 2px 0; }
  </style>
  <script>
    let map;
    let markers = [];
    let storedCycles = [];
    let routeLine = null;
    const kuet = { lat: 22.9009, lng: 89.5016 };

    function clearMarkers() { markers.forEach(marker => marker.setMap(null)); markers = []; }
    function renderCycles(cycles) {
      storedCycles = Array.isArray(cycles) ? cycles : [];
      if (!map) return;
      clearMarkers();
      const bounds = new google.maps.LatLngBounds();
      storedCycles.forEach(cycle => {
        const position = { lat: Number(cycle.lat), lng: Number(cycle.lng) };
        if (!Number.isFinite(position.lat) || !Number.isFinite(position.lng)) return;
        const marker = new google.maps.Marker({ position, map, title: cycle.label });
        const info = new google.maps.InfoWindow({ content: `<div class="map-card"><strong>${safe(cycle.label)}</strong><br>${safe(cycle.pickup)}</div>` });
        marker.addListener('click', () => {
          info.open({ map, anchor: marker });
          if (window.campusCycleBridge) window.campusCycleBridge.selectCycle(String(cycle.id));
        });
        markers.push(marker); bounds.extend(position);
      });
      if (markers.length > 1) map.fitBounds(bounds, 72);
      else if (markers.length === 1) { map.setCenter(markers[0].getPosition()); map.setZoom(16); }
    }
    function drawRoute(points) {
      if (!map || !Array.isArray(points) || points.length < 2) return;
      if (routeLine) routeLine.setMap(null);
      const path = points.map(point => ({ lat: Number(point.lat), lng: Number(point.lng) }))
        .filter(point => Number.isFinite(point.lat) && Number.isFinite(point.lng));
      if (path.length < 2) return;
      routeLine = new google.maps.Polyline({ path, geodesic: true, strokeColor: '#1266d6', strokeOpacity: 0.92, strokeWeight: 5 });
      routeLine.setMap(map);
      const bounds = new google.maps.LatLngBounds();
      path.forEach(point => bounds.extend(point));
      map.fitBounds(bounds, 72);
    }
    function safe(value) { const box = document.createElement('span'); box.textContent = String(value ?? ''); return box.innerHTML; }
    window.CampusCycleMap = { setCycles: renderCycles, drawRoute };
    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: kuet, zoom: 15, mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
        zoomControl: true, clickableIcons: false
      });
      renderCycles(storedCycles);
    }
  </script>
  <script async src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&callback=initMap"></script>
</head>
<body><div id="map" aria-label="KUET cycle location map"></div></body>
</html>
